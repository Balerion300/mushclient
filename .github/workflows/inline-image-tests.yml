name: Inline image backend tests
on:
  pull_request:
  push:
    branches: [codex/inline-static-images]
jobs:
  native-images:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow
      - run: python tests/run_native_tests.py
